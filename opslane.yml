port: 3000
dockerfile: docker/Dockerfile
services: [postgres, redis, s3, smtp]
health_path: /signin
env:
  NODE_ENV: production
  NEXTAUTH_SECRET: 2f20b5616f08a58158b290b84dd78ced44dca85eef4e4451cbaeccfec5ee4ca4
  NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
  NEXT_PRIVATE_DATABASE_URL: postgres://app:app@pg:5432/app
  NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://app:app@pg:5432/app
  NEXT_PRIVATE_REDIS_URL: redis://redis:6379
  NEXT_PRIVATE_ENCRYPTION_KEY: 2137bae0918b537b353d9dede6935d6b2993473d40a96aad57b0b438bbc6e5ec
  NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: e84093baee5dcd5e7b638bff7695ec21a1ef2d18afcf794c5aa3098d1d40b75a
  NEXT_PRIVATE_SMTP_HOST: smtp
  NEXT_PRIVATE_SMTP_PORT: "2500"
  NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
  NEXT_PRIVATE_SIGNING_TRANSPORT: local
  NEXT_PRIVATE_UPLOAD_TRANSPORT: s3
  NEXT_PRIVATE_UPLOAD_ENDPOINT: http://minio:9000
  NEXT_PRIVATE_UPLOAD_BUCKET: app-bucket
  NEXT_PRIVATE_UPLOAD_REGION: us-east-1
  NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: app
  NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: appsecret
  NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "true"
seed: |
  set -e
  cd /app/apps/remix
  npx prisma migrate deploy --schema ../../packages/prisma/schema.prisma
  HOSTNAME=0.0.0.0 PORT=3000 node build/server/main.js > /tmp/seed-server.log 2>&1 &
  SERVER_PID=$!
  READY=""
  for i in $(seq 1 45); do
    if curl -fsS http://localhost:3000/api/auth/csrf > /dev/null 2>&1; then READY=1; break; fi
    sleep 2
  done
  if [ -z "$READY" ]; then echo "SEED_FAIL: app never became ready"; tail -50 /tmp/seed-server.log; exit 1; fi
  node -e '
    const main = async () => {
      const res = await fetch("http://localhost:3000/api/auth/email-password/signup", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: "Opslane Admin", email: "admin@documenso.com", password: "OpslaneVerify123!" }),
      });
      console.log("SEED: signup status", res.status, (await res.text()).slice(0, 200));
    };
    main().catch((err) => { console.error("SEED: signup request failed:", err.message); });
  '
  node -e '
    const { PrismaClient } = require("@prisma/client");
    const bcrypt = require("@node-rs/bcrypt");
    const prisma = new PrismaClient();
    prisma.user.update({
      where: { email: "admin@documenso.com" },
      data: { emailVerified: new Date(), password: bcrypt.hashSync("password") },
    })
      .then((user) => { console.log("SEED_OK: user", user.id, "verified, password aligned"); return prisma.$disconnect(); })
      .catch((err) => { console.error("SEED_FAIL:", err.message); process.exit(1); });
  '
  kill $SERVER_PID 2> /dev/null || true
auth:
  session_command: node scripts/opslane-session.cjs
verify_setup:
  instructions: |
    Log in as admin@documenso.com / password (seeded during boot via the app's
    own signup API; the personal organisation and team are created
    automatically). After login the documents page may redirect to a team URL
    such as /t/personal_.../documents — stay on that team URL.
    No documents are pre-seeded: when an acceptance criterion needs a document
    or template, create it through the UI first (upload any small PDF via the
    documents page) and wait for the editor canvas/PDF to render before
    interacting with fields.
notes: |
  Dockerfile-first config. The production image self-migrates on boot
  (docker/start.sh runs prisma migrate deploy). The seed one-shot runs before
  app boot: it migrates, briefly starts the server, creates the admin user via
  the app's signup API (so the organisation/team graph is built by app code,
  not raw SQL), then marks the email verified and aligns the password with the
  stored verifier credentials.
